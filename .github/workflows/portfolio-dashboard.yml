name: Portfolio Dashboard Build
on:
  push:
    paths:
      - 'portfolio/**'
      - 'orchestration/**'
      - 'dashboard/**'
      - 'schemas/**'
      - '.github/workflows/portfolio-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python dashboard/build_portfolio.py
      - uses: actions/upload-artifact@v4
        with:
          name: project-control-center-dashboard
          path: |
            dashboard/
            portfolio/status/index.json
            portfolio/version-history/
