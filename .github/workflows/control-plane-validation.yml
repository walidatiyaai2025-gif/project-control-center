name: Control Plane Validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  self-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/self_audit.py
      - run: python -m unittest scripts/test_control_plane.py scripts/test_feature_delivery.py scripts/test_fleet_control.py scripts/test_output_discipline.py -v
      - run: python scripts/orchestrator.py --report-out /tmp/orchestration-report.json
      - run: python dashboard/build_portfolio.py > /tmp/dashboard.json
      - name: Audit PCC main protection (non-blocking until admin credential is configured)
        continue-on-error: true
        run: python scripts/self_protection.py
      - run: python -m json.tool portfolio/projects.yml > /dev/null
      - run: python -m json.tool portfolio/priorities.yml > /dev/null
      - run: python -m json.tool orchestration/desired-state.json > /dev/null
      - run: python -m json.tool orchestration/observed-state.json > /dev/null
      - run: python -m json.tool orchestration/audit-ledger.json > /dev/null
      - run: python -m json.tool orchestration/baselines/AIMWWEB.json > /dev/null
      - run: python -m json.tool orchestration/reconciliation/AIMWWEB.json > /dev/null
      - run: python -m json.tool schemas/project.schema.json > /dev/null
      - run: python -m json.tool schemas/task.schema.json > /dev/null
      - run: python -m json.tool schemas/project-status.schema.json > /dev/null
      - run: python -m json.tool schemas/project-profile.schema.json > /dev/null
      - run: python -m json.tool schemas/version-manifest.schema.json > /dev/null
      - run: python -m json.tool schemas/version-history.schema.json > /dev/null
      - run: python -m json.tool schemas/orchestration-operation.schema.json > /dev/null
      - run: python -m json.tool schemas/feature-delivery-matrix.schema.json > /dev/null
      - run: python -m json.tool schemas/screen-inventory.schema.json > /dev/null
      - run: python -m json.tool schemas/screen-action-matrix.schema.json > /dev/null
      - run: python -m json.tool schemas/worker-handoff.schema.json > /dev/null
      - run: python -m json.tool schemas/qa-handoff.schema.json > /dev/null
      - run: python -m json.tool schemas/ci-handoff.schema.json > /dev/null
      - run: python -m json.tool schemas/visual-qa-handoff.schema.json > /dev/null
      - run: python -m json.tool schemas/integration-handoff.schema.json > /dev/null
      - run: python -m json.tool schemas/release-handoff.schema.json > /dev/null
