name: Control Plane Validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  self-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/self_audit.py
      - run: python scripts/fleet_readiness.py
      - run: python -m unittest scripts/test_control_plane.py scripts/test_feature_delivery.py scripts/test_fleet_control.py scripts/test_fleet_readiness.py scripts/test_route_work.py scripts/test_output_discipline.py -v
      - run: python scripts/orchestrator.py --report-out /tmp/orchestration-report.json
      - run: python dashboard/build_portfolio.py > /tmp/dashboard.json
      - name: Audit PCC main protection (non-blocking until admin credential is configured)
        continue-on-error: true
        run: python scripts/self_protection.py
      - name: Validate JSON-compatible control-plane documents
        shell: bash
        run: |
          set -euo pipefail
          files=(
            portfolio/projects.yml
            portfolio/project-routing.json
            portfolio/priorities.yml
            portfolio/status/index.json
            orchestration/desired-state.json
            orchestration/observed-state.json
            orchestration/audit-ledger.json
            orchestration/policy-catalog.json
            templates/PROJECT_PROFILE.yml
            templates/PROJECT_ROUTING.json
            templates/MANAGED_REPOSITORY_CONTROL.yml
            schemas/project.schema.json
            schemas/project-family.schema.json
            schemas/task.schema.json
            schemas/project-status.schema.json
            schemas/project-profile.schema.json
            schemas/version-manifest.schema.json
            schemas/version-history.schema.json
            schemas/orchestration-operation.schema.json
            schemas/feature-delivery-matrix.schema.json
            schemas/screen-inventory.schema.json
            schemas/screen-action-matrix.schema.json
            schemas/worker-handoff.schema.json
            schemas/qa-handoff.schema.json
            schemas/ci-handoff.schema.json
            schemas/visual-qa-handoff.schema.json
            schemas/integration-handoff.schema.json
            schemas/release-handoff.schema.json
          )
          while IFS= read -r f; do files+=("$f"); done < <(find orchestration/baselines orchestration/reconciliation -maxdepth 1 -type f -name '*.json' | sort)
          for f in "${files[@]}"; do python -m json.tool "$f" > /dev/null; done
