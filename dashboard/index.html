<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Control Center</title><style>body{font-family:system-ui;margin:24px;background:#f6f7f9;color:#111}h1{margin-bottom:4px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}.card,.project,table{background:white;border:1px solid #ddd;border-radius:10px}.card,.project{padding:16px}.n{font-size:28px;font-weight:700}table{width:100%;border-collapse:collapse;overflow:hidden}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:12px}th{background:#fafafa}.projects{display:grid;gap:16px;margin-top:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.pill{display:inline-block;padding:3px 7px;border:1px solid #ddd;border-radius:999px;margin:2px;font-size:12px}@media(max-width:900px){table{display:block;overflow:auto}}</style></head><body><h1>Project Control Center</h1><div id="meta"></div><div class="cards" id="cards"></div><table><thead><tr><th>Project</th><th>Health</th><th>Production Version</th><th>Development Version</th><th>Customer Ready</th><th>Integration Gaps</th><th>False Done</th><th>Unreachable Screens</th><th>Backend Only</th><th>UI Only</th><th>Missing Bindings</th><th>Control Plane</th></tr></thead><tbody id="rows"></tbody></table><div class="projects" id="project-details"></div><script src="app.js"></script></body></html>
